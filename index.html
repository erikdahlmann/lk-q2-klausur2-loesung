<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>2. Klausur · Musterlösung</title>
<style>
:root{--papier:#f4f1ea;--karte:#fff;--akzent:#3a5a78;--tinte:#22201c;--leise:#6b665c;--linie:rgba(120,112,98,.22);--fehler:#a3302a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--papier);color:var(--tinte);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#33506e,#2b3f54);color:#fff;padding:44px 16px 36px}
header div,main{max-width:420px;margin:0 auto}
header p{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
header h1{margin:0;font:600 clamp(28px,4vw,36px)/1.15 "Iowan Old Style",Palatino,Georgia,serif}
main{width:100%;padding:28px 16px;flex:1}
form{background:var(--karte);border:1px solid var(--linie);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
form p{margin:0}
label{font-size:14px;font-weight:600}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--linie);border-radius:8px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--akzent);outline-offset:2px}
.merken{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--leise)}
button{font:inherit;font-weight:600;background:var(--akzent);color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#fehler{color:var(--fehler);font-size:15px}
footer{padding:20px 16px 32px;border-top:1px solid var(--linie);font-size:14px;color:var(--leise);text-align:center}
footer a{color:var(--leise)}
</style>
</head>
<body>
<header><div><p>Paul-Klee-Gymnasium Overath</p><h1>Mathe-LK Q2 · Musterlösung zur 2. Klausur</h1></div></header>
<main>
<form id="anmelden">
<p>Diese Seite ist mit einem Passwort geschützt. Das Passwort bekommst du im Kurs.</p>
<label for="passwort">Passwort</label>
<input id="passwort" type="password" autocomplete="current-password" required autofocus>
<label class="merken"><input id="merken" type="checkbox"> Auf diesem Gerät merken</label>
<button type="submit">Öffnen</button>
<p id="fehler" role="alert" hidden>Das Passwort ist falsch.</p>
</form>
</main>

const ABLAGE="lk-q2-klausur2-schluessel";
const bytes=t=>Uint8Array.from(atob(t),z=>z.charCodeAt(0));
const text=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function lies(){try{return localStorage.getItem(ABLAGE)}catch(e){return null}}
function schreib(w){try{w?localStorage.setItem(ABLAGE,w):localStorage.removeItem(ABLAGE)}catch(e){}}
async function ausPasswort(pw){
  const basis=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(D.s),iterations:D.n,hash:"SHA-256"},basis,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function oeffnen(schluessel){
  const klar=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(D.i)},schluessel,bytes(D.c));
  // Solange die Anmeldeseite noch lädt, würde document.write anhängen statt ersetzen.
  if(document.readyState!=="complete")await new Promise(r=>addEventListener("load",r,{once:true}));
  document.open();document.write(new TextDecoder().decode(klar));document.close();
}
(async()=>{
  const gemerkt=lies();
  if(!gemerkt)return;
  try{await oeffnen(await crypto.subtle.importKey("raw",bytes(gemerkt),"AES-GCM",false,["decrypt"]))}
  catch(e){schreib(null)}
})();
document.getElementById("anmelden").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const knopf=ev.target.querySelector("button"),fehler=document.getElementById("fehler");
  knopf.disabled=true;fehler.hidden=true;
  try{
    const schluessel=await ausPasswort(document.getElementById("passwort").value);
    const merken=document.getElementById("merken").checked;
    const roh=await crypto.subtle.exportKey("raw",schluessel);
    await oeffnen(schluessel);
    schreib(merken?text(roh):null);
  }catch(e){
    fehler.hidden=false;knopf.disabled=false;
  }
});
})();
</script>
